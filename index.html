<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú & Pedidos | Dark Kitchen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-32">

  <!-- Encabezado con Fondo Verde Oscuro -->
  <header class="bg-emerald-900 text-white py-6 text-center shadow-md">
    <h1 class="text-3xl font-bold tracking-wide">BURGER KITCHEN</h1>
    <p class="text-emerald-200 text-sm mt-1">Sabor Gourmet • Pedidos a Domicilio / Retiro</p>

    <!-- Barra de Pestañas / Navegación -->
    <nav class="flex justify-center gap-4 mt-6">
      <button onclick="cambiarPestana('menu')" id="btn-pestana-menu" class="px-5 py-2 font-bold rounded-full bg-white text-emerald-900 shadow transition">
        🍔 Ver Menú
      </button>
      <button onclick="cambiarPestana('equipo')" id="btn-pestana-equipo" class="px-5 py-2 font-bold rounded-full bg-emerald-800 text-emerald-100 hover:bg-emerald-700 transition">
        👥 Nuestro Equipo
      </button>
    </nav>
  </header>

  <main class="max-w-2xl mx-auto p-4">

    <!-- PESTAÑA 1: MENÚ DE PRODUCTOS -->
    <section id="seccion-menu">
      <!-- Sección Hamburguesas -->
      <h2 class="text-xl font-bold mb-4 border-b pb-2 text-gray-700">Hamburguesas</h2>
      <div id="menu-hamburguesas" class="space-y-4 mb-8"></div>

      <!-- Sección Extras -->
      <h2 class="text-xl font-bold mb-4 border-b pb-2 text-gray-700">Extras & Acompañamientos</h2>
      <div id="menu-extras" class="space-y-4"></div>
    </section>

    <!-- PESTAÑA 2: NUESTRO EQUIPO -->
    <section id="seccion-equipo" class="hidden">
      <h2 class="text-xl font-bold mb-4 border-b pb-2 text-gray-700">Conoce a Nuestro Equipo</h2>
      <p class="text-sm text-gray-600 mb-6 text-center">
        Detrás de cada hamburguesa hay un equipo apasionado por la gastronomía y la calidad.
      </p>

      <div id="contenedor-equipo" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </section>

  </main>

  <!-- Carrito / Formulario de Envío (Flotante) -->
  <div id="carrito-flotante" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-300 shadow-2xl p-4 max-w-2xl mx-auto">
    <div class="flex justify-between items-center mb-3">
      <span class="font-bold text-lg">Total:</span>
      <span id="total-price" class="font-extrabold text-xl text-green-600">$0 CLP</span>
    </div>
    
    <!-- Campos de datos del cliente -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-3">
      <input type="text" id="nombre" placeholder="Tu Nombre" class="border p-2 rounded w-full text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800">
      <input type="tel" id="telefono" placeholder="Tu Teléfono (ej: +56912345678)" class="border p-2 rounded w-full text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800">
      <input type="text" id="direccion" placeholder="Dirección / Sector (o Retiro)" class="border p-2 rounded w-full text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800">
    </div>

    <button onclick="enviarWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition flex justify-center items-center gap-2">
      <span>Confirmar Pedido por WhatsApp</span>
    </button>
  </div>

  <script>
    const TELEFONO_WHATSAPP = "56912345678"; 

    // Integrantes del Equipo (Puedes cambiar nombres, cargos e imágenes)
    const equipo = [
      {
        nombre: "Carlos Gómez",
        cargo: "Chef Principal & Fundador",
        foto: "https://images.unsplash.com/photo-1577219491135-ce391730fb2c?w=300&q=80",
        bio: "Especialista en parrilla y creador de nuestras recetas exclusivas."
      },
      {
        nombre: "Sofía Martínez",
        cargo: "Jefa de Cocina",
        foto: "https://images.unsplash.com/photo-1581299894007-aaa50297cf16?w=300&q=80",
        bio: "Encargada del control de calidad e insumos frescos todos los días."
      },
      {
        nombre: "Mateo Silva",
        cargo: "Encargado de Logística",
        foto: "https://images.unsplash.com/photo-1560250097-0b93528c311a?w=300&q=80",
        bio: "Asegura que cada pedido llegue caliente y a tiempo a tu puerta."
      }
    ];

    // Productos
    const hamburguesas = [
      { 
        id: 1, 
        nombre: "Hamburguesa Doble Smash", 
        precio: 5500, 
        desc: "Doble carne, doble queso cheddar y salsa secreta.",
        imagen: "SmashDobleQues.jpeg"
      },
      { 
        id: 2, 
        nombre: "Hamburguesa Gourmet", 
        precio: 7500, 
        desc: "Carne 180g, tocino crocante, cebolla caramelizada y queso gouda.",
        imagen: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=300&q=80"
      },
      { 
        id: 3, 
        nombre: "Hamburguesa BBQ Bacon", 
        precio: 6800, 
        desc: "Carne 150g, queso cheddar, tocino ahumado, aros de cebolla y salsa BBQ.",
        imagen: "https://images.unsplash.com/photo-1553979459-d2229ba7433b?w=300&q=80"
      },
      { 
        id: 4, 
        nombre: "Hamburguesa Veggie", 
        precio: 6200, 
        desc: "Medallón de garbanzo y lentejas, queso, lechuga, tomate y palta.",
        imagen: "https://images.unsplash.com/photo-1520072959219-c595dc870360?w=300&q=80"
      },
      { 
        id: 5, 
        nombre: "Combo Smash Completo", 
        precio: 8500, 
        desc: "Doble smash con papas fritas medianas y lata de bebida a elección.",
        imagen: "https://images.unsplash.com/photo-1610440042657-612c34d95e9f?w=300&q=80"
      }
    ];

    const extras = [
      { 
        id: 101, 
        nombre: "Papas Fritas Artesanales", 
        precio: 2500, 
        desc: "Porción de papas fritas crujientes con sal de mar.",
        imagen: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300&q=80"
      },
      { 
        id: 102, 
        nombre: "Aros de Cebolla (8 uds)", 
        precio: 3000, 
        desc: "Crujientes aros de cebolla empanizados acompañados de salsa BBQ.",
        imagen: "https://images.unsplash.com/photo-1639024471283-03518883512d?w=300&q=80"
      },
      { 
        id: 103, 
        nombre: "Nuggets de Pollo (6 uds)", 
        precio: 3200, 
        desc: "Nuggets de pechuga de pollo crujientes con salsa a elección.",
        imagen: "https://images.unsplash.com/photo-1562967914-608f82629710?w=300&q=80"
      }
    ];

    const todosLosProductos = [...hamburguesas, ...extras];
    let carrito = {};

    // Cambiar entre la pestaña Menú y Pestaña Equipo
    function cambiarPestana(pestana) {
      const secMenu = document.getElementById('seccion-menu');
      const secEquipo = document.getElementById('seccion-equipo');
      const carrito = document.getElementById('carrito-flotante');
      const btnMenu = document.getElementById('btn-pestana-menu');
      const btnEquipo = document.getElementById('btn-pestana-equipo');

      if (pestana === 'menu') {
        secMenu.classList.remove('hidden');
        secEquipo.classList.add('hidden');
        carrito.classList.remove('hidden');

        btnMenu.className = "px-5 py-2 font-bold rounded-full bg-white text-emerald-900 shadow transition";
        btnEquipo.className = "px-5 py-2 font-bold rounded-full bg-emerald-800 text-emerald-100 hover:bg-emerald-700 transition";
      } else {
        secMenu.classList.add('hidden');
        secEquipo.classList.remove('hidden');
        carrito.classList.add('hidden');

        btnEquipo.className = "px-5 py-2 font-bold rounded-full bg-white text-emerald-900 shadow transition";
        btnMenu.className = "px-5 py-2 font-bold rounded-full bg-emerald-800 text-emerald-100 hover:bg-emerald-700 transition";
      }
    }

    function cargarEquipo() {
      const container = document.getElementById('contenedor-equipo');
      container.innerHTML = equipo.map(member => `
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 text-center">
          <img src="${member.foto}" alt="${member.nombre}" class="w-24 h-24 object-cover rounded-full mx-auto mb-3 border-2 border-emerald-800">
          <h3 class="font-bold text-base text-gray-900">${member.nombre}</h3>
          <p class="text-xs font-semibold text-emerald-700 mb-2">${member.cargo}</p>
          <p class="text-xs text-gray-500">${member.bio}</p>
        </div>
      `).join('');
    }

    function crearTarjetaProducto(p) {
      return `
        <div class="bg-white p-3 sm:p-4 rounded-lg shadow-sm border border-gray-200 flex items-center justify-between gap-3">
          <img src="${p.imagen}" alt="${p.nombre}" class="w-20 h-20 sm:w-24 sm:h-24 object-cover rounded-md flex-shrink-0">
          <div class="flex-grow pr-2">
            <h3 class="font-bold text-sm sm:text-base text-gray-900">${p.nombre}</h3>
            <p class="text-xs text-gray-500 mb-1 line-clamp-2">${p.desc}</p>
            <span class="font-bold text-sm sm:text-base text-gray-800">$${p.precio.toLocaleString('es-CL')} CLP</span>
          </div>
          <div class="flex flex-col sm:flex-row items-center space-y-1 sm:space-y-0 sm:space-x-2">
            <button onclick="cambiarCantidad(${p.id}, -1)" class="bg-gray-200 text-gray-700 px-3 py-1 rounded font-bold hover:bg-gray-300">-</button>
            <span id="cant-${p.id}" class="font-bold text-sm w-4 text-center">0</span>
            <button onclick="cambiarCantidad(${p.id}, 1)" class="bg-black text-white px-3 py-1 rounded font-bold hover:bg-gray-800">+</button>
          </div>
        </div>
      `;
    }

    function cargarMenu() {
      const containerBurgers = document.getElementById('menu-hamburguesas');
      const containerExtras = document.getElementById('menu-extras');

      containerBurgers.innerHTML = hamburguesas.map(p => crearTarjetaProducto(p)).join('');
      containerExtras.innerHTML = extras.map(p => crearTarjetaProducto(p)).join('');
    }

    function cambiarCantidad(id, cambio) {
      carrito[id] = (carrito[id] || 0) + cambio;
      if (carrito[id] <= 0) delete carrito[id];
      document.getElementById(`cant-${id}`).innerText = carrito[id] || 0;
      actualizarTotal();
    }

    function actualizarTotal() {
      let total = 0;
      for (let id in carrito) {
        let p = todosLosProductos.find(prod => prod.id == id);
        if (p) total += p.precio * carrito[id];
      }
      document.getElementById('total-price').innerText = `$${total.toLocaleString('es-CL')} CLP`;
    }

    function enviarWhatsApp() {
      const nombre = document.getElementById('nombre').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const direccion = document.getElementById('direccion').value.trim();

      if (Object.keys(carrito).length === 0) {
        alert("Por favor selecciona al menos un producto.");
        return;
      }
      if (!nombre || !telefono || !direccion) {
        alert("Por favor completa tu nombre, teléfono y dirección/modalidad de entrega.");
        return;
      }

      let mensaje = `*¡Nuevo Pedido!*%0A`;
      mensaje += `*Cliente:* ${nombre}%0A`;
      mensaje += `*Teléfono:* ${telefono}%0A`;
      mensaje += `*Dirección/Entrega:* ${direccion}%0A%0A`;
      mensaje += `*Detalle del pedido:*%0A`;

      let total = 0;
      for (let id in carrito) {
        let p = todosLosProductos.find(prod => prod.id == id);
        if (p) {
          let subtotal = p.precio * carrito[id];
          total += subtotal;
          mensaje += `- ${carrito[id]}x ${p.nombre} ($${subtotal.toLocaleString('es-CL')})%0A`;
        }
      }

      mensaje += `%0A*Total a Pagar:* $${total.toLocaleString('es-CL')} CLP`;

      const url = `https://wa.me/${TELEFONO_WHATSAPP}?text=${mensaje}`;
      window.open(url, '_blank');
    }

    // Inicializar
    cargarMenu();
    cargarEquipo();
  </script>
</body>
</html>
