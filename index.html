<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú & Pedidos | Dark Kitchen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-32">

  <!-- Encabezado con Fondo Verde Oscuro -->
  <header class="bg-emerald-900 text-white py-6 text-center shadow-md">
    <h1 class="text-3xl font-bold tracking-wide">BURGER KITCHEN</h1>
    <p class="text-emerald-200 text-sm mt-1">Sabor Gourmet • Pedidos a Domicilio / Retiro</p>

    <!-- Navegación -->
    <nav class="flex justify-center gap-4 mt-6">
      <button onclick="cambiarPestana('menu')" id="btn-pestana-menu" class="px-5 py-2 font-bold rounded-full bg-white text-emerald-900 shadow transition">
        🍔 Ver Menú
      </button>
      <button onclick="cambiarPestana('equipo')" id="btn-pestana-equipo" class="px-5 py-2 font-bold rounded-full bg-emerald-800 text-emerald-100 hover:bg-emerald-700 transition">
        👥 Nuestro Equipo
      </button>
    </nav>
  </header>

  <main class="max-w-2xl mx-auto p-4">

    <!-- Indicador de Carga -->
    <div id="loading-stock" class="text-center py-4 text-emerald-800 font-bold">
      🔄 Sincronizando stock disponible...
    </div>

    <!-- PESTAÑA 1: MENÚ -->
    <section id="seccion-menu" class="hidden">
      <h2 class="text-xl font-bold mb-4 border-b pb-2 text-gray-700">Hamburguesas</h2>
      <div id="menu-hamburguesas" class="space-y-4 mb-8"></div>

      <h2 class="text-xl font-bold mb-4 border-b pb-2 text-gray-700">Extras & Acompañamientos</h2>
      <div id="menu-extras" class="space-y-4"></div>
    </section>

    <!-- PESTAÑA 2: NUESTRO EQUIPO Y LOCAL -->
    <section id="seccion-equipo" class="hidden">
      <!-- Carrusel -->
      <h2 class="text-xl font-bold mb-4 border-b pb-2 text-gray-700">Conoce Nuestro Local</h2>
      <div class="relative w-full h-56 sm:h-72 overflow-hidden rounded-lg shadow-md mb-8 bg-black">
        <img id="carrusel-img" src="" alt="Foto del local" class="w-full h-full object-cover transition-all duration-500">
        <button onclick="moverCarrusel(-1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 text-white p-2 rounded-full">❮</button>
        <button onclick="moverCarrusel(1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 text-white p-2 rounded-full">❯</button>
        <div id="carrusel-indicadores" class="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-1.5"></div>
      </div>

      <!-- Integrantes -->
      <h2 class="text-xl font-bold mb-4 border-b pb-2 text-gray-700">Nuestro Equipo</h2>
      <div id="contenedor-equipo" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </section>

  </main>

  <!-- Carrito / Formulario de Envío -->
  <div id="carrito-flotante" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-300 shadow-2xl p-4 max-w-2xl mx-auto hidden">
    <div class="flex justify-between items-center mb-3">
      <span class="font-bold text-lg">Total:</span>
      <span id="total-price" class="font-extrabold text-xl text-green-600">$0 CLP</span>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-3">
      <input type="text" id="nombre" placeholder="Tu Nombre" class="border p-2 rounded w-full text-sm">
      <input type="tel" id="telefono" placeholder="Tu Teléfono" class="border p-2 rounded w-full text-sm">
      <input type="text" id="direccion" placeholder="Dirección / Sector (o Retiro)" class="border p-2 rounded w-full text-sm">
    </div>

    <button onclick="enviarWhatsApp()" id="btn-confirmar" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition flex justify-center items-center gap-2">
      <span>Confirmar Pedido por WhatsApp</span>
    </button>
  </div>

  <script>
    // PEGA AQUÍ LA URL GENERADA POR TU GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbz12NbHeGFEmyodf6s5_KC5b5YB6T8jmchSE6GPh49v82T_ZZLdaTO2NQDParJ4MNg5vg/exec";
    const TELEFONO_WHATSAPP = "56912345678"; 

    const fotosLocal = [
      "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800&q=80",
      "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800&q=80"
    ];

    const equipo = [
      { nombre: "Carlos Gómez", cargo: "Chef Principal", foto: "https://images.unsplash.com/photo-1577219491135-ce391730fb2c?w=300&q=80", bio: "Especialista en parrilla." }
    ];

    let hamburguesas = [
      { id: 1, nombre: "Hamburguesa Doble Smash", precio: 5500, desc: "Doble carne y queso cheddar.", imagen: "SmashDobleQues.jpeg", stock: 0 },
      { id: 2, nombre: "Hamburguesa Gourmet", precio: 7500, desc: "Carne 180g y tocino.", imagen: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=300&q=80", stock: 0 },
      { id: 3, nombre: "Hamburguesa BBQ Bacon", precio: 6800, desc: "Queso, tocino y BBQ.", imagen: "https://images.unsplash.com/photo-1553979459-d2229ba7433b?w=300&q=80", stock: 0 },
      { id: 4, nombre: "Hamburguesa Veggie", precio: 6200, desc: "Medallón vegetal.", imagen: "https://images.unsplash.com/photo-1520072959219-c595dc870360?w=300&q=80", stock: 0 },
      { id: 5, nombre: "Combo Smash Completo", precio: 8500, desc: "Smash + Papas + Bebida.", imagen: "https://images.unsplash.com/photo-1610440042657-612c34d95e9f?w=300&q=80", stock: 0 }
    ];

    let extras = [
      { id: 101, nombre: "Papas Fritas Artesanales", precio: 2500, desc: "Porción grande.", imagen: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300&q=80", stock: 0 },
      { id: 102, nombre: "Aros de Cebolla (8 uds)", precio: 3000, desc: "Con salsa BBQ.", imagen: "https://images.unsplash.com/photo-1639024471283-03518883512d?w=300&q=80", stock: 0 },
      { id: 103, nombre: "Nuggets de Pollo (6 uds)", precio: 3200, desc: "Crujientes.", imagen: "https://images.unsplash.com/photo-1562967914-608f82629710?w=300&q=80", stock: 0 }
    ];

    let carrito = {};

    // Obtener Stock desde Google Sheets
    async function obtenerStockBD() {
      try {
        const res = await fetch(API_URL);
        const stockBD = await res.json();

        stockBD.forEach(item => {
          let p = hamburguesas.find(x => x.id == item.id) || extras.find(x => x.id == item.id);
          if (p) p.stock = item.stock;
        });

        document.getElementById('loading-stock').classList.add('hidden');
        document.getElementById('seccion-menu').classList.remove('hidden');
        document.getElementById('carrito-flotante').classList.remove('hidden');
        cargarMenu();
      } catch (err) {
        document.getElementById('loading-stock').innerText = " Error al cargar el stock. Mostrando menú de respaldo.";
        document.getElementById('seccion-menu').classList.remove('hidden');
        document.getElementById('carrito-flotante').classList.remove('hidden');
        cargarMenu();
      }
    }

    function crearTarjetaProducto(p) {
      const agotado = p.stock <= 0;
      const critico = p.stock > 0 && p.stock < 3;

      let badgeStock = '';
      if (agotado) {
        badgeStock = `<span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold">Agotado</span>`;
      } else if (critico) {
        badgeStock = `<span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold animate-pulse">¡Últimas ${p.stock} unids!</span>`;
      } else {
        badgeStock = `<span class="text-xs text-gray-500">Disp: ${p.stock}</span>`;
      }

      return `
        <div class="bg-white p-3 sm:p-4 rounded-lg shadow-sm border border-gray-200 flex items-center justify-between gap-3 ${agotado ? 'opacity-60' : ''}">
          <img src="${p.imagen}" alt="${p.nombre}" class="w-20 h-20 sm:w-24 sm:h-24 object-cover rounded-md flex-shrink-0">
          <div class="flex-grow pr-2">
            <div class="flex items-center gap-2 mb-1">
              <h3 class="font-bold text-sm sm:text-base text-gray-900">${p.nombre}</h3>
              ${badgeStock}
            </div>
            <p class="text-xs text-gray-500 mb-1 line-clamp-2">${p.desc}</p>
            <span class="font-bold text-sm sm:text-base text-gray-800">$${p.precio.toLocaleString('es-CL')} CLP</span>
          </div>
          <div class="flex flex-col sm:flex-row items-center space-y-1 sm:space-y-0 sm:space-x-2">
            <button onclick="cambiarCantidad(${p.id}, -1)" ${agotado ? 'disabled' : ''} class="bg-gray-200 text-gray-700 px-3 py-1 rounded font-bold disabled:opacity-50">-</button>
            <span id="cant-${p.id}" class="font-bold text-sm w-4 text-center">0</span>
            <button onclick="cambiarCantidad(${p.id}, 1)" ${agotado ? 'disabled' : ''} class="bg-black text-white px-3 py-1 rounded font-bold hover:bg-gray-800 disabled:opacity-50">+</button>
          </div>
        </div>
      `;
    }

    function cargarMenu() {
      document.getElementById('menu-hamburguesas').innerHTML = hamburguesas.map(p => crearTarjetaProducto(p)).join('');
      document.getElementById('menu-extras').innerHTML = extras.map(p => crearTarjetaProducto(p)).join('');
    }

    function cambiarCantidad(id, cambio) {
      let p = [...hamburguesas, ...extras].find(prod => prod.id == id);
      let actual = carrito[id] || 0;
      let nuevo = actual + cambio;

      if (nuevo > p.stock) {
        alert(`Lo sentimos, solo quedan ${p.stock} unidades disponibles de ${p.nombre}.`);
        return;
      }

      carrito[id] = nuevo;
      if (carrito[id] <= 0) delete carrito[id];
      document.getElementById(`cant-${id}`).innerText = carrito[id] || 0;
      actualizarTotal();
    }

    function actualizarTotal() {
      let total = 0;
      let todos = [...hamburguesas, ...extras];
      for (let id in carrito) {
        let p = todos.find(prod => prod.id == id);
        if (p) total += p.precio * carrito[id];
      }
      document.getElementById('total-price').innerText = `$${total.toLocaleString('es-CL')} CLP`;
    }

    async function enviarWhatsApp() {
      const nombre = document.getElementById('nombre').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const direccion = document.getElementById('direccion').value.trim();

      if (Object.keys(carrito).length === 0) {
        alert("Por favor selecciona al menos un producto.");
        return;
      }
      if (!nombre || !telefono || !direccion) {
        alert("Por favor completa tu nombre, teléfono y dirección.");
        return;
      }

      const btn = document.getElementById('btn-confirmar');
      btn.innerText = "Procesando pedido...";
      btn.disabled = true;

      // Descontar Stock en Google Sheets
      let itemsParaDescontar = [];
      let todos = [...hamburguesas, ...extras];

      let mensaje = `*¡Nuevo Pedido!*%0A`;
      mensaje += `*Cliente:* ${nombre}%0A`;
      mensaje += `*Teléfono:* ${telefono}%0A`;
      mensaje += `*Dirección/Entrega:* ${direccion}%0A%0A`;
      mensaje += `*Detalle del pedido:*%0A`;

      let total = 0;
      for (let id in carrito) {
        let p = todos.find(prod => prod.id == id);
        if (p) {
          let subtotal = p.precio * carrito[id];
          total += subtotal;
          mensaje += `- ${carrito[id]}x ${p.nombre} ($${subtotal.toLocaleString('es-CL')})%0A`;
          itemsParaDescontar.push({ id: p.id, cantidad: carrito[id] });
        }
      }
      mensaje += `%0A*Total a Pagar:* $${total.toLocaleString('es-CL')} CLP`;

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ items: itemsParaDescontar })
        });
      } catch (err) {
        console.error("Error al descontar stock:", err);
      }

      btn.innerText = "Confirmar Pedido por WhatsApp";
      btn.disabled = false;

      const url = `https://wa.me/${TELEFONO_WHATSAPP}?text=${mensaje}`;
      window.open(url, '_blank');
      location.reload(); 
    }

    // Funciones Pestañas y Carrusel
    let indiceFotoActual = 0;
    function actualizarCarrusel() {
      document.getElementById('carrusel-img').src = fotosLocal[indiceFotoActual];
      document.getElementById('carrusel-indicadores').innerHTML = fotosLocal.map((_, i) => `
        <span class="w-2.5 h-2.5 rounded-full ${i === indiceFotoActual ? 'bg-white' : 'bg-white/50'}"></span>
      `).join('');
    }
    function moverCarrusel(dir) {
      indiceFotoActual = (indiceFotoActual + dir + fotosLocal.length) % fotosLocal.length;
      actualizarCarrusel();
    }
    function cambiarPestana(p) {
      if (p === 'menu') {
        document.getElementById('seccion-menu').classList.remove('hidden');
        document.getElementById('seccion-equipo').classList.add('hidden');
        document.getElementById('carrito-flotante').classList.remove('hidden');
      } else {
        document.getElementById('seccion-menu').classList.add('hidden');
        document.getElementById('seccion-equipo').classList.remove('hidden');
        document.getElementById('carrito-flotante').classList.add('hidden');
      }
    }

    // Inicializar
    obtenerStockBD();
    actualizarCarrusel();
  </script>
</body>
</html>
